<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wiki — Eurovision 2026</title>
<style>
  :root {
    --pink:#FF98F4; --pink-soft:rgba(255,152,244,0.10); --pink-tint:rgba(255,152,244,0.05);
    --ink:#D0D5DD;
    --grey-0:#101828; --grey-1:#1D2939; --grey-2:#344054; --grey-3:#344054; --grey-4:#4F5F79; --grey-5:#4E5D76; --grey-6:#98A2B3; --grey-7:#D0D5DD;
    --av-border:#101828;
    --purple:#a855f7; --purple-soft:#270045; --purple-ink:#D8B4FE;
    --amber-bg:#48324C; --amber-ink:#FFE6DD;
    --red-bg:#3D1F2C; --red-ink:#FFC0CB;
    --green-bg:#1A3D34; --green-ink:#6BFFDC;
    --violet-bg:#270045; --violet-ink:#D8B4FE;
    --blue-bg:#1A2E4D; --blue-ink:#93C5FD;
    --line:#344054;
    --aid3n:#a74cee; --aid3n-bg:rgba(167,76,238,0.18);
    --mm:#ff98f4;
    --schem:#6bffdc;
    --takes:#feff70;
    --wiki:#e6ccfa; --wiki-bg:rgba(230,204,250,0.18);
    --supp:#ff8559;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:#0A1020; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text","Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; font-size:14px; }
  .mono { font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace; }

  .app { display:grid; grid-template-columns:72px 280px 1fr; min-height:100vh; height:100vh; }

  /* Icon rail · Octopus minimised nav */
  .rail { background:var(--grey-1); border-right:1px solid var(--line); padding:14px 0 12px; display:flex; flex-direction:column; align-items:center; gap:4px; overflow-y:auto; }
  .rail::-webkit-scrollbar { display:none; }
  .rail .brand { width:36px; height:36px; border-radius:8px; display:grid; place-items:center; margin-bottom:4px; flex-shrink:0; }
  .rail a.icon { text-decoration:none; color:inherit; }
  .rail .icon { width:44px; height:44px; border-radius:10px; display:grid; place-items:center; color:var(--grey-6); cursor:pointer; position:relative; flex-shrink:0; }
  .rail .icon:hover { background:var(--grey-2); color:var(--ink); }
  .rail .icon.active { background:rgba(255,109,240,0.12); color:#FF6DF0; }
  .rail .icon svg { width:22px; height:22px; stroke-width:1.6; }
  .rail .icon.prod-launcher { padding:0; }
  .rail .icon.prod-launcher:hover { background:transparent; }
  .rail .icon.prod-launcher img { width:36px; height:36px; border-radius:8px; display:block; transition:transform 0.15s; }
  .rail .icon.prod-launcher:hover img { transform:scale(1.06); }
  .rail .spacer { flex:1; min-height:12px; }
  .rail .storage { font-size:10px; color:var(--grey-6); margin-top:4px; flex-shrink:0; }
  .rail .dot-notify { position:absolute; top:6px; right:8px; width:8px; height:8px; background:#FF98F4; border-radius:50%; }
  .rail .rail-sep { width:28px; height:1px; background:var(--line); margin:6px 0; flex-shrink:0; }
  .rail .rail-gap { height:14px; flex-shrink:0; }

  /* Production sidebar */
  .side { background:#131D2E; border-right:1px solid var(--line); padding:24px 18px; display:flex; flex-direction:column; gap:4px; overflow-y:auto; }
  .side .back { display:inline-flex; align-items:center; gap:8px; color:var(--grey-6); font-size:12px; cursor:pointer; margin-bottom:14px; text-decoration:none; }
  .side .back:hover { color:var(--ink); }
  .side .back svg { width:14px; height:14px; stroke-width:1.8; }
  .side .prod-name { font-size:17px; font-weight:600; line-height:1.25; margin-bottom:8px; }
  .pill { padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  .pill .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.rehearsal { color:var(--amber-ink); background:var(--amber-bg); }
  .side .prod-sub { font-size:12px; color:var(--grey-6); margin-top:8px; line-height:1.5; }
  .side hr { border:none; border-top:1px solid var(--line); margin:16px 0; }
  .group-label { font-size:10px; color:var(--grey-5); letter-spacing:0.08em; text-transform:uppercase; padding:0 8px 8px; font-weight:600; display:flex; align-items:center; justify-content:space-between; }
  .nav-list { display:flex; flex-direction:column; gap:1px; margin-bottom:6px; }
  .nav-list .item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--grey-7); text-decoration:none; }
  .nav-list .item:hover { background:var(--grey-2); }
  .nav-list .item.active { background:var(--pink-soft); color:var(--ink); font-weight:500; }
  .nav-list .item.locked { color:var(--grey-5); cursor:not-allowed; }
  .nav-list .item .ico { width:18px; height:18px; display:grid; place-items:center; flex-shrink:0; }
  .nav-list .item .ico svg { width:18px; height:18px; stroke-width:1.6; }
  .nav-list .item .count { margin-left:auto; font-size:11px; color:var(--grey-5); }
  .nav-list .item .lock { margin-left:auto; font-size:10px; color:var(--grey-5); display:inline-flex; align-items:center; }
  .nav-list .item .lock svg { width:11px; height:11px; stroke-width:2; }
  .nav-list .item .pico { width:18px; height:18px; border-radius:4px; flex-shrink:0; }

  /* Main · canvas-dark with dot pattern */
  .main { display:flex; flex-direction:column; min-width:0; background-color:#0A1020; min-height:0; overflow:hidden; }
  .main-top { padding:14px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:16px; background:rgba(10,16,32,0.85); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); flex-shrink:0; }
  .breadcrumb { display:flex; align-items:center; gap:8px; color:var(--grey-6); font-size:13px; flex:1; min-width:0; overflow-x:auto; white-space:nowrap; scrollbar-width:none; }
  .breadcrumb::-webkit-scrollbar { display:none; }
  .breadcrumb .crumb { cursor:pointer; text-decoration:none; color:inherit; flex-shrink:0; }
  .breadcrumb .crumb:hover { color:var(--ink); }
  .breadcrumb .sep { color:var(--grey-4); flex-shrink:0; }
  .breadcrumb .current { color:var(--ink); font-weight:500; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; max-width:280px; }

  /* Top-bar wiki search */
  .topbar-search {
    display:flex; align-items:center; gap:8px;
    padding:6px 12px; border-radius:8px;
    background:var(--grey-1); border:1px solid var(--grey-3);
    min-width:280px;
    transition:border-color 0.15s, background 0.15s;
  }
  .topbar-search:focus-within { border-color:var(--wiki); background:rgba(230,204,250,0.04); }
  .topbar-search svg { width:14px; height:14px; stroke-width:1.7; color:var(--grey-5); flex-shrink:0; }
  .topbar-search input {
    flex:1; background:transparent; border:none; outline:none;
    font-size:12px; color:var(--ink); font-family:inherit;
  }
  .topbar-search input::placeholder { color:var(--grey-5); }
  .topbar-search kbd {
    font-family:"JetBrains Mono",monospace;
    font-size:10px; padding:1px 5px;
    background:var(--grey-2); border:1px solid var(--grey-3); border-radius:3px;
    color:var(--grey-6);
  }

  /* ───────────────── Wiki layout ───────────────── */
  .wiki {
    flex:1;
    display:grid;
    grid-template-columns: 1fr 280px;
    min-height:0;
    overflow:hidden;
  }

  /* Page content (center) */
  .wiki__main {
    overflow-y:auto;
    background:#0A1020;
    background-image: radial-gradient(circle at center, #344054 1px, transparent 1.6px);
    background-size: 40px 40px;
  }
  .wiki__breadcrumbs {
    padding:14px 64px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--grey-6);
    background:rgba(10,16,32,0.75); backdrop-filter:blur(8px);
    position:sticky; top:0; z-index:10;
  }
  .wiki__breadcrumbs svg { width:11px; height:11px; stroke-width:2; color:var(--grey-5); }
  .wiki__breadcrumbs .current { color:var(--ink); font-weight:500; }
  .wiki__breadcrumbs [data-jump] { cursor:pointer; }
  .wiki__breadcrumbs [data-jump]:hover { color:var(--ink); }

  .wiki__page {
    max-width:820px;
    margin:0 auto;
    padding:48px 64px 96px;
  }
  .wiki__page-icon {
    width:56px; height:56px;
    border-radius:14px;
    background:var(--wiki-bg);
    color:var(--wiki);
    display:grid; place-items:center;
    margin-bottom:18px;
    border:1px solid rgba(230,204,250,0.16);
  }
  .wiki__page-icon svg { width:30px; height:30px; stroke-width:1.6; }
  .wiki__page-title {
    font-size:38px; font-weight:600; letter-spacing:-0.02em;
    line-height:1.15; margin:0 0 14px; color:var(--ink);
  }
  .wiki__page-byline {
    display:flex; align-items:center; gap:8px;
    flex-wrap:wrap;
    font-size:13px; color:var(--grey-6);
    margin-bottom:28px;
    padding-bottom:20px; border-bottom:1px solid var(--line);
  }
  .wiki__byline-av { width:22px; height:22px; border-radius:50%; color:#fff; font-size:9px; font-weight:600; display:grid; place-items:center; }
  .wiki__byline-av.magenta { background:#FF6DF0; }
  .wiki__byline-av.aqua { background:#6BFFDC; color:#0a0a0c; }
  .wiki__byline-av.violet { background:#a74cee; }
  .wiki__byline-av.coral { background:#FF8559; }
  .wiki__byline-name { color:var(--ink); font-weight:500; }
  .wiki__byline-sep { color:var(--grey-5); }
  .wiki__byline-extra { display:inline-flex; align-items:center; gap:6px; }
  .wiki__byline-extra .dot-aid { width:6px; height:6px; border-radius:50%; background:var(--aid3n); }
  .wiki__byline-extra .dot-data { width:6px; height:6px; border-radius:50%; background:var(--green-ink); }

  /* Aid3n summary callout */
  .wiki__aid-callout {
    display:flex; gap:14px;
    background:linear-gradient(135deg, rgba(167,76,238,0.14), rgba(255,109,240,0.08));
    border:1px solid rgba(167,76,238,0.30);
    border-radius:12px;
    padding:18px 20px;
    margin-bottom:24px;
  }
  .wiki__aid-av {
    width:36px; height:36px; border-radius:50%;
    background:rgba(0,0,0,0.25);
    border:1px solid rgba(255,255,255,0.06);
    display:grid; place-items:center;
    flex-shrink:0;
  }
  .wiki__aid-av svg { width:18px; height:23px; display:block; }
  .wiki__aid-body { flex:1; min-width:0; }
  .wiki__aid-head {
    display:flex; align-items:center; gap:9px;
    margin-bottom:8px;
  }
  .wiki__aid-head b { color:var(--ink); font-size:13px; font-weight:600; }
  .wiki__aid-badge {
    font-size:10px; padding:2px 7px; border-radius:4px;
    background:var(--aid3n-bg); color:var(--aid3n);
    font-family:"JetBrains Mono",monospace; font-weight:700;
    letter-spacing:0.04em; text-transform:uppercase;
  }
  .wiki__aid-quote {
    color:var(--aid3n); font-style:italic; line-height:1.5; font-size:14px;
    margin:0 0 12px;
  }
  .wiki__aid-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .wiki__aid-btn {
    padding:7px 14px; border-radius:7px; font-size:12px; font-weight:600;
    border:1px solid transparent; cursor:pointer; font-family:inherit;
    transition:filter 0.15s, background 0.15s, border-color 0.15s;
  }
  .wiki__aid-btn-primary {
    background:var(--aid3n); color:#fff;
    box-shadow:0 4px 12px -4px var(--aid3n);
  }
  .wiki__aid-btn-primary:hover { filter:brightness(1.08); }
  .wiki__aid-btn-secondary {
    background:transparent; border-color:rgba(167,76,238,0.4);
    color:var(--purple-ink);
  }
  .wiki__aid-btn-secondary:hover { background:rgba(167,76,238,0.10); border-color:var(--aid3n); }

  /* Body prose */
  .wiki__body { color:var(--ink); font-size:15px; line-height:1.65; }
  .wiki__body p { margin:0 0 16px; }
  .wiki__body h2 { font-size:20px; font-weight:600; letter-spacing:-0.01em; margin:32px 0 12px; color:var(--ink); }
  .wiki__body h3 { font-size:16px; font-weight:600; margin:24px 0 8px; color:var(--ink); }
  .wiki__body ul, .wiki__body ol { padding-left:22px; margin:0 0 16px; }
  .wiki__body li { margin-bottom:6px; }
  .wiki__body a { color:var(--wiki); text-decoration:underline; text-decoration-color:rgba(230,204,250,0.4); text-underline-offset:2px; }
  .wiki__body strong { color:var(--ink); font-weight:600; }
  .wiki__body em { color:var(--grey-6); font-style:italic; }

  /* Live binding data chip */
  .data-chip {
    display:inline-flex; align-items:center; gap:5px;
    padding:2px 8px; border-radius:5px;
    background:rgba(107,255,220,0.10);
    border:1px solid rgba(107,255,220,0.25);
    color:var(--green-ink); font-weight:600; font-size:13px;
    font-family:"JetBrains Mono",monospace;
    vertical-align:baseline;
    cursor:help;
  }
  .data-chip::before {
    content:""; width:5px; height:5px; border-radius:50%;
    background:var(--green-ink); flex-shrink:0;
  }
  .data-chip:hover { background:rgba(107,255,220,0.15); }

  /* Link chip — references another lens */
  .wiki__chip-link {
    display:inline-flex; align-items:center; gap:5px;
    padding:2px 8px; border-radius:5px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--grey-3);
    color:var(--ink); font-size:13px; font-weight:500;
    text-decoration:none;
    vertical-align:baseline;
  }
  .wiki__chip-link:hover { background:rgba(255,255,255,0.06); border-color:var(--grey-4); }
  .wiki__chip-link svg { width:12px; height:12px; stroke-width:2; }
  .wiki__chip-link.mm { color:var(--mm); border-color:rgba(255,152,244,0.30); }
  .wiki__chip-link.schem { color:var(--schem); border-color:rgba(107,255,220,0.30); }
  .wiki__chip-link.takes { color:var(--takes); border-color:rgba(254,255,112,0.30); }

  /* Callout */
  .wiki__callout {
    display:flex; gap:12px;
    padding:14px 16px; border-radius:10px;
    margin:18px 0;
    font-size:14px; line-height:1.55;
  }
  .wiki__callout svg { width:18px; height:18px; flex-shrink:0; margin-top:1px; }
  .wiki__callout strong { display:block; margin-bottom:4px; font-size:13px; }
  .wiki__callout p { margin:0; color:var(--ink); }
  .wiki__callout.info { background:rgba(167,76,238,0.10); border:1px solid rgba(167,76,238,0.25); color:var(--aid3n); }
  .wiki__callout.warn { background:rgba(255,133,89,0.10); border:1px solid rgba(255,133,89,0.25); color:var(--supp); }
  .wiki__callout.success { background:rgba(107,255,220,0.10); border:1px solid rgba(107,255,220,0.25); color:var(--green-ink); }

  /* Table */
  .wiki__table {
    width:100%; border-collapse:collapse;
    margin:14px 0 20px; font-size:13px;
    background:rgba(19,29,46,0.4);
    border:1px solid var(--line); border-radius:10px;
    overflow:hidden;
  }
  .wiki__table th, .wiki__table td {
    padding:10px 12px; text-align:left;
    border-bottom:1px solid var(--line);
  }
  .wiki__table th {
    font-size:11px; font-weight:600;
    color:var(--grey-6); text-transform:uppercase; letter-spacing:0.04em;
    background:rgba(255,255,255,0.02);
  }
  .wiki__table tr:last-child td { border-bottom:none; }
  .wiki__table td { color:var(--ink); }

  /* Panels (at-a-glance) */
  .wiki__panels {
    display:grid; grid-template-columns:repeat(2, 1fr);
    gap:10px; margin:14px 0 20px;
  }
  .wiki__panel {
    background:rgba(19,29,46,0.5);
    border:1px solid var(--line); border-radius:10px;
    padding:14px 16px;
  }
  .wiki__panel-ico {
    width:28px; height:28px; border-radius:7px;
    color:var(--wiki); background:var(--wiki-bg);
    display:grid; place-items:center;
    margin-bottom:8px;
  }
  .wiki__panel-ico svg { width:16px; height:16px; stroke-width:1.7; }
  .wiki__panel-title { font-size:11px; font-weight:600; color:var(--grey-6); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px; }
  .wiki__panel-body { font-size:13px; color:var(--ink); }

  /* Page-link tile */
  .wiki__pagelinks { display:flex; flex-direction:column; gap:8px; margin:8px 0 20px; }
  .wiki__pagelink {
    display:flex; align-items:center; gap:12px;
    padding:12px 14px; border-radius:8px;
    background:rgba(19,29,46,0.5); border:1px solid var(--line);
    cursor:pointer; transition:border-color 0.15s, background 0.15s;
    text-decoration:none; color:inherit;
  }
  .wiki__pagelink:hover { border-color:var(--wiki); background:rgba(230,204,250,0.04); }
  .wiki__pagelink-ico {
    width:32px; height:32px; border-radius:8px;
    background:var(--wiki-bg); color:var(--wiki);
    display:grid; place-items:center;
    flex-shrink:0;
  }
  .wiki__pagelink-ico svg { width:18px; height:18px; stroke-width:1.7; }
  .wiki__pagelink-title { font-size:14px; font-weight:600; color:var(--ink); margin-bottom:2px; }
  .wiki__pagelink-meta { font-size:11px; color:var(--grey-6); }

  /* Contribute composer at bottom of every wiki page */
  .wiki__contribute {
    margin-top:56px; padding-top:24px;
    border-top:1px solid var(--line);
  }
  .wiki__contribute-label {
    font-size:10px; color:var(--grey-5); letter-spacing:0.08em;
    text-transform:uppercase; font-weight:700;
    font-family:"JetBrains Mono",monospace;
    margin-bottom:12px;
    display:flex; align-items:center; gap:8px;
  }
  .wiki__contribute-label .count { font-family:inherit; color:var(--grey-6); }
  .wiki__contribute-card {
    background:rgba(19,29,46,0.5);
    border:1px solid var(--grey-3);
    border-radius:12px;
    padding:14px 18px;
    transition:border-color 0.15s;
  }
  .wiki__contribute-card:focus-within { border-color:var(--wiki); }
  .wiki__contribute-head { display:flex; gap:12px; align-items:flex-start; }
  .wiki__contribute-av {
    width:32px; height:32px; border-radius:50%;
    background:var(--purple); color:#fff;
    font-size:11px; font-weight:600;
    display:grid; place-items:center;
    flex-shrink:0;
  }
  .wiki__contribute-stack { flex:1; min-width:0; }
  .wiki__contribute-input {
    width:100%;
    padding:8px 0;
    background:transparent; border:none; outline:none;
    color:var(--ink); font-family:inherit; font-size:14px;
    resize:vertical; min-height:24px; max-height:240px;
    line-height:1.5;
  }
  .wiki__contribute-input::placeholder { color:var(--grey-5); }
  .wiki__contribute-meta {
    font-size:11px; color:var(--grey-6);
    margin-top:6px; display:flex; align-items:center; gap:6px;
  }
  .wiki__contribute-tools {
    display:flex; gap:6px; align-items:center;
    margin-top:14px; padding-top:12px;
    border-top:1px solid var(--line);
  }
  .wiki__contribute-tool {
    background:transparent; border:none;
    color:var(--grey-6); font-size:12px;
    cursor:pointer; padding:6px 10px; border-radius:6px;
    display:inline-flex; align-items:center; gap:6px;
    font-family:inherit;
  }
  .wiki__contribute-tool:hover { background:var(--grey-2); color:var(--ink); }
  .wiki__contribute-tool svg { width:14px; height:14px; stroke-width:1.7; }
  .wiki__contribute-aid {
    color:var(--aid3n); margin-left:auto;
  }
  .wiki__contribute-aid:hover { background:rgba(167,76,238,0.10); color:var(--aid3n); }
  .wiki__contribute-submit {
    padding:8px 14px; border-radius:8px;
    background:var(--wiki); color:#0a0a0c;
    font-size:12px; font-weight:600; border:none; cursor:pointer;
    font-family:inherit;
    transition:filter 0.15s;
  }
  .wiki__contribute-submit:hover { filter:brightness(1.06); }
  .wiki__contribute-submit:disabled { opacity:0.5; cursor:not-allowed; }

  /* ── Right: page tree ── */
  .wiki__tree-col {
    border-left:1px solid var(--line);
    background:rgba(19,29,46,0.45);
    padding:18px 14px;
    display:flex; flex-direction:column; gap:10px;
    overflow-y:auto;
  }
  .wiki__search {
    display:flex; align-items:center; gap:8px;
    background:var(--grey-1); border:1px solid var(--grey-3);
    border-radius:8px; padding:7px 10px;
  }
  .wiki__search svg { width:14px; height:14px; stroke-width:1.7; color:var(--grey-5); flex-shrink:0; }
  .wiki__search input { flex:1; background:transparent; border:none; outline:none; font-size:12px; color:var(--ink); font-family:inherit; }
  .wiki__search input::placeholder { color:var(--grey-5); }
  .wiki__newpage {
    display:flex; align-items:center; gap:8px;
    padding:7px 10px; border-radius:8px;
    background:rgba(230,204,250,0.10); color:var(--wiki);
    border:1px solid rgba(230,204,250,0.25);

  // ───────── State + handles ─────────
  let currentPageId = 'overview';   // Wiki lands on Show overview by default
  let searchQuery = '';
  const treeRoot = document.getElementById('wikiTree');
  const topbarCrumb = document.getElementById('wikiTopbar');
  const titleEl = document.getElementById('wikiTitle');
  const iconEl  = document.getElementById('wikiPageIcon');
  const bylineEl = document.getElementById('wikiByline');
  const contentEl = document.getElementById('wikiContent');

  // ───────── Helpers ─────────
  function initials(name) { return name.split(' ').map(s => s[0]).slice(0, 2).join(''); }
  function pageById(id) { return WIKI_PAGES.find(p => p.id === id); }
  function childrenOf(id) { return WIKI_PAGES.filter(p => p.parent === id); }
  function getBreadcrumbs(page) {
    const out = [];
    let p = page;
    while (p) { out.unshift(p); p = p.parent ? pageById(p.parent) : null; }
    return out;
  }

  // ───────── Render: tree ─────────
  function renderTree() {
    const filterFn = !searchQuery ? null
      : p => p.title.toLowerCase().includes(searchQuery.toLowerCase());
    function hasMatchingDescendant(p) {
      const kids = childrenOf(p.id);
      return kids.some(k => filterFn(k) || hasMatchingDescendant(k));
    }
    function buildBranch(parent, depth) {
      const kids = WIKI_PAGES
        .filter(p => p.parent === parent)
        .filter(p => !filterFn || filterFn(p) || hasMatchingDescendant(p));
      return kids.map(p => {
        const hasKids = childrenOf(p.id).length > 0;
        const active = p.id === currentPageId ? ' is-active' : '';
        const toggle = hasKids
          ? `<span class="wiki__tree-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`
          : `<span class="wiki__tree-spacer"></span>`;
        return `
          <li>
            <div class="wiki__tree-row${active}" data-page-id="${p.id}" style="padding-left:${8 + depth * 12}px;">
              ${toggle}
              <span class="wiki__tree-ico">${SVG[p.icon] || SVG.document}</span>
              <span class="wiki__tree-label">${p.title}</span>
            </div>
            ${hasKids ? `<ul>${buildBranch(p.id, depth + 1)}</ul>` : ''}
          </li>`;
      }).join('');
    }
    treeRoot.innerHTML = buildBranch(null, 0);
    treeRoot.querySelectorAll('.wiki__tree-row').forEach(row => {
      row.addEventListener('click', () => selectPage(row.dataset.pageId));
    });
  }

  // ───────── Render: page ─────────
  function renderPage() {
    const page = pageById(currentPageId);
    if (!page) return;
    titleEl.textContent = page.title;
    iconEl.innerHTML = SVG[page.icon] || SVG.document;

    const liveBindings = (WIKI_CONTENT[page.id] || '').match(/data-chip/g)?.length || 0;
    const aiSugg = (WIKI_CONTENT[page.id] || '').match(/wiki__aid-callout/g)?.length || 0;
    const readMin = Math.max(1, Math.ceil(page.words / 200));
    bylineEl.innerHTML = `
      <span class="wiki__byline-av ${page.bylineColor || 'magenta'}">${initials(page.author)}</span>
      <span class="wiki__byline-name">${page.author}</span>
      <span class="wiki__byline-sep">·</span>
      <span>edited ${page.edited}</span>
      <span class="wiki__byline-sep">·</span>
      <span>${page.words.toLocaleString()} words · ${readMin} min read</span>
      ${liveBindings ? `<span class="wiki__byline-sep">·</span><span class="wiki__byline-extra"><span class="dot-data"></span>${liveBindings} live binding${liveBindings === 1 ? '' : 's'}</span>` : ''}
      ${aiSugg ? `<span class="wiki__byline-sep">·</span><span class="wiki__byline-extra"><span class="dot-aid"></span>${aiSugg} AI suggestion${aiSugg === 1 ? '' : 's'}</span>` : ''}
    `;

    contentEl.innerHTML = WIKI_CONTENT[page.id] || `<p>${page.title} — this page is a stub. Click <strong>Edit</strong> to start writing.</p>`;

    // Expand sub-pages tiles
    contentEl.querySelectorAll('[data-pagelinks-for]').forEach(holder => {
      const parentId = holder.dataset.pagelinksFor;
      const kids = childrenOf(parentId);
      holder.innerHTML = kids.length
        ? kids.map(k => `
          <a class="wiki__pagelink" data-jump-id="${k.id}">
            <span class="wiki__pagelink-ico">${SVG[k.icon] || SVG.document}</span>
            <div>
              <div class="wiki__pagelink-title">${k.title}</div>
              <div class="wiki__pagelink-meta">${k.author} · ${k.edited}</div>
            </div>
          </a>`).join('')
        : `<p style="color:var(--grey-6);">No sub-pages yet.</p>`;
      holder.querySelectorAll('[data-jump-id]').forEach(a => {
        a.addEventListener('click', () => selectPage(a.dataset.jumpId));
      });
    });
  }

  function renderBreadcrumbs() {
    // Single merged breadcrumb in the topbar:
    //   Productions / Eurovision 2026 / Wiki / [parent…] / [current page]
    const page = pageById(currentPageId);
    const trail = getBreadcrumbs(page);
    const segs = [];

    segs.push(`<a class="crumb" href="productions-grid.html">Productions</a>`);
    segs.push(`<span class="sep">/</span>`);
    segs.push(`<a class="crumb" href="production-home.html">Eurovision 2026</a>`);
    segs.push(`<span class="sep">/</span>`);
    // "Wiki" jumps to the default overview page; below it the page hierarchy.
    segs.push(`<span class="crumb" data-jump="overview">Wiki</span>`);
    trail.forEach((c, i) => {
      const isLast = i === trail.length - 1;
      segs.push(`<span class="sep">/</span>`);
      segs.push(isLast
        ? `<span class="current">${c.title}</span>`
        : `<span class="crumb" data-jump="${c.id}">${c.title}</span>`);
    });

    topbarCrumb.innerHTML = segs.join('');
    topbarCrumb.querySelectorAll('[data-jump]').forEach(b => {
      b.addEventListener('click', () => selectPage(b.dataset.jump));
    });
  }

  function selectPage(id) {
    if (!pageById(id)) return;
    currentPageId = id;
    renderTree();
    renderPage();
    renderBreadcrumbs();
    document.querySelector('.wiki__main')?.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('wikiSearch').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderTree();
  });

  // Cmd/Ctrl + K — focus the wiki search
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      document.getElementById('wikiSearch')?.focus();
    }
  });

  // Contribute composer — auto-grow + enable submit when there's input
  const composerInput = document.getElementById('wikiContributeInput');
  const composerSubmit = document.getElementById('wikiContributeSubmit');
  if (composerInput) {
    composerInput.addEventListener('input', () => {
      composerInput.style.height = 'auto';
      composerInput.style.height = Math.min(240, composerInput.scrollHeight) + 'px';
      composerSubmit.disabled = composerInput.value.trim().length === 0;
    });
    composerSubmit.addEventListener('click', () => {
      const text = composerInput.value.trim();
      if (!text) return;
      composerInput.value = '';
      composerInput.style.height = 'auto';
      composerSubmit.disabled = true;
      // In a real app this would post to the wiki — this prototype just confirms.
      composerSubmit.textContent = 'Posted ✓';
      setTimeout(() => composerSubmit.textContent = 'Comment', 1500);
    });
  }

  // Initial render
  renderTree();
  renderPage();
  renderBreadcrumbs();
</script>
